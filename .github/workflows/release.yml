name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/EXTRARNAS-fat.jar target/EXTRARNAS-${{ matrix.artifact }}.jar

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/EXTRARNAS-fat.jar target/EXTRARNAS-${{ matrix.artifact }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXTRARNAS-${{ matrix.artifact }}
          path: target/EXTRARNAS-${{ matrix.artifact }}.jar

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          mkdir release
          find artifacts -name "*.jar" -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          generate_release_notes: true
          files: release/*.jar